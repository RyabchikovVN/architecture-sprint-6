apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalable-pod-identifier
  labels:
    app: scalable-pod-identifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalable-pod-identifier
  template:
    metadata:
      labels:
        app: scalable-pod-identifier
    spec:
      containers:
      - name: scaletestapp
        image: shestera/scaletestapp:latest
        ports:
            - containerPort: 8080
        resources:
         requests:
           memory: "20Mi"
         limits:
           memory: "30Mi" 